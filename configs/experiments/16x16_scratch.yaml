# Experiment B: 16x16 / 40 mines trained from random init. Same budget and knobs as 16x16_finetune.yaml
# (configs/16x16.yaml with a 25M-step budget; baseline lr/target settings since Experiment A found no clear winner).
name: exp_16x16_scratch
height: 16
width: 16
n_mines: 40
n_envs: 256
total_steps: 25000000
channels: 64
n_layers: 5
buffer_size: 400000
batch_size: 256
learning_starts: 50000
target_update_every: 1000
eps_decay_frac: 0.2
eval_every: 1000000
eval_games: 1000
checkpoint_every_minutes: 10
