# Experiment B: fine-tune the 9x9 model (models/dqn_9x9_10.pt) on 16x16 / 40 mines. Weights only: fresh optimizer,
# replay and counters. Epsilon starts at 0.1 (the net already plays well) and decays to 0.01 over the same 20% of steps.
name: exp_16x16_finetune
height: 16
width: 16
n_mines: 40
n_envs: 256
total_steps: 25000000
channels: 64
n_layers: 5
buffer_size: 400000
batch_size: 256
learning_starts: 50000
target_update_every: 1000
eps_decay_frac: 0.2
eval_every: 1000000
eval_games: 1000
checkpoint_every_minutes: 10
init_from: models/dqn_9x9_10.pt
eps_start: 0.1
